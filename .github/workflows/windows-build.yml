name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EXE and MSI
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm test
          pnpm typecheck

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features desktop-app

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expectedTag = "v$(node -p "require('./package.json').version")"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag"
          }

      - name: Build Windows bundles
        run: >-
          pnpm tauri build
          --features desktop-app
          --config src-tauri/tauri.windows-unsigned.conf.json
          --bundles nsis,msi
          --verbose
          --ci

      - name: Collect release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $output = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Copy-Item "src-tauri/target/release/arrive-focus.exe" (Join-Path $output "arrive-focus.exe")

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer was not generated" }
          Copy-Item $nsis.FullName (Join-Path $output "Focus_${version}_x64-setup.exe")

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI installer was not generated" }
          Copy-Item $msi.FullName (Join-Path $output "Focus_${version}_x64_zh-CN.msi")

          Get-ChildItem "$output/*" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $output "SHA256SUMS.txt") -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Windows-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "抵达 Focus $tag" --notes "Windows x64 安装包由 GitHub Actions 自动构建。当前版本尚未进行 Authenticode 签名。"
          }
          Get-ChildItem "release-assets/*" | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
