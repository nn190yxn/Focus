[package]
name = "arrive-focus"
version = "0.1.6"
description = "A local-first Windows focus system"
authors = ["Arrive Focus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arrive_focus_core"
path = "src/lib.rs"

[[bin]]
name = "arrive-focus"
path = "src/main.rs"
required-features = ["desktop-app"]

[features]
default = []
tauri = ["dep:tauri"]
desktop-app = [
    "tauri",
    "dep:dirs",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:tauri-winrt-notification",
    "tauri/tray-icon",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "=1.11.0", features = ["v4"] }
sha2 = "0.10"
log = "0.4"
dirs = { version = "6", optional = true }
tauri = { version = "2.8", features = [], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-winrt-notification = { version = "0.7.3", optional = true }

[dev-dependencies]
proptest = "=1.7.0"
tempfile = "=3.21.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2.4", features = [] }
